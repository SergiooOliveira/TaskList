<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Edit book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#CDAA63}a:hover{color:#E6C788}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #08070A; color: #E9E1D3; font-family: Inter, system-ui, sans-serif; font-size: 14px;">
  <div style="position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 44px 20px 12px; background: #08070A; border-bottom: 1px solid #221D16;">
    <a href="BookDetail.dc.html" style="min-height: 44px; display: flex; align-items: center; color: #A79C88; text-decoration: none; font-size: 14px;">Cancel</a>
    <div style="font-family: Cinzel, Georgia, serif; font-size: 14px; letter-spacing: .16em; color: #CDAA63;">EDIT BOOK</div>
    <a href="BookDetail.dc.html" style="min-height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 999px; background: #CDAA63; color: #08070A; font-weight: 500; text-decoration: none; font-size: 14px;">Save</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 16px 20px 28px;">
    <div style="display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: end;">
      <div style="width: 72px; height: 108px; background: linear-gradient(160deg,#2B1A3A,#0F0B18); box-shadow: 0 0 0 1px #3A3224;"></div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="display: grid; gap: 4px; font-size: 11px; letter-spacing: .12em; color: #A79C88; font-family: Cinzel, Georgia, serif;">TITLE
          <input value="Lendários" style="font: 18px 'Cormorant Garamond', Georgia, serif; font-weight: 600; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 4px 0;">
        </label>
        <button style="align-self: start; padding: 6px 12px; border: 1px solid #CDAA63; background: none; color: #CDAA63; font-size: 12px; border-radius: 999px;">Find details</button>
      </div>
    </div>

    <section style="display: grid; gap: 10px;">
      <h2 style="margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 500; font-size: 11px; letter-spacing: .18em; color: #A79C88;">BOOK</h2>
      <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Author<input value="Tracy Deonn" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0;"></label>
      <div style="display: grid; grid-template-columns: 1fr 72px; gap: 12px;">
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Series<input value="The Legendborn Cycle" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Number<input value="1" inputmode="numeric" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
      </div>
      <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Summary<textarea rows="3" style="font: 15px/1.35 'Cormorant Garamond', Georgia, serif; color: #D8CFBE; background: transparent; border: 1px solid #3A3224; padding: 8px; resize: vertical;">Depois da morte da mãe, Bree Matthews entra num programa para alunos dotados na universidade…</textarea></label>
    </section>

    <section style="display: grid; gap: 10px;">
      <h2 style="margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 500; font-size: 11px; letter-spacing: .18em; color: #A79C88;">DETAILS</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Form<input value="Prose" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Pages<input value="573" inputmode="numeric" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
      </div>
      <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Genres<input value="Fantasy, Fiction, Young Adult Fiction" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0;"></label>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Language<input value="Portuguese" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Cover URL<input value="https://books.google…" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
      </div>
    </section>

    <section style="display: grid; gap: 10px;">
      <h2 style="margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 500; font-size: 11px; letter-spacing: .18em; color: #A79C88;">MY COPY</h2>
      <div role="group" aria-label="Ownership" style="display: flex; align-self: start; padding: 3px; border: 1px solid #3A3224; border-radius: 999px;">
        <button aria-pressed="true" style="padding: 6px 14px; border: 0; border-radius: 999px; background: #CDAA63; color: #08070A; font-size: 13px; font-weight: 500;">I own it</button>
        <button aria-pressed="false" style="padding: 6px 14px; border: 0; border-radius: 999px; background: none; color: #A79C88; font-size: 13px;">I want it</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Price paid (€)<input value="2,90" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Store<input value="Bertrand" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Started on<input value="09/06/2026" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
        <label style="display: grid; gap: 2px; font-size: 12px; color: #A79C88;">Finished on<input placeholder="—" style="font: inherit; font-size: 15px; color: #E9E1D3; background: transparent; border: 0; border-bottom: 1px solid #3A3224; padding: 6px 0; min-width: 0;"></label>
      </div>
      <div role="group" aria-label="Rating" style="display: flex; gap: 2px; font-size: 22px; color: #CDAA63;">
        <button aria-label="1 star" style="background: none; border: 0; color: inherit; font: inherit; padding: 0 2px;">★</button><button aria-label="2 stars" style="background: none; border: 0; color: inherit; font: inherit; padding: 0 2px;">★</button><button aria-label="3 stars" style="background: none; border: 0; color: inherit; font: inherit; padding: 0 2px;">★</button><button aria-label="4 stars" style="background: none; border: 0; color: #3A3224; font: inherit; padding: 0 2px;">★</button><button aria-label="5 stars" style="background: none; border: 0; color: #3A3224; font: inherit; padding: 0 2px;">★</button>
      </div>
    </section>

    <button style="align-self: center; padding: 8px 14px; background: none; border: 0; color: #C45A4A; font-size: 13px;">Delete this book</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
